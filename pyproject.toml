# --- Architecture ablations (J7), added 2026-08-10 ------------------------------
# The jury's objection to J7 was that the architecture was described but not
# justified, and until now the two choices it asks about had never been measured:
# `encoder_bidirectional` and `use_bottleneck` were declared, overridable, and
# left at their defaults by every experiment. Argument and citation can defend a
# design; only these two runs can say what it is worth.
#
# Both keys were verified to change the model rather than only the record:
#
#   baseline                          encoder 158,720   bottleneck 20,896   450,258 params
#   encoder_bidirectional = false     encoder 224,256   bottleneck 20,896   515,794 params
#   use_bottleneck = false            encoder 158,720   bottleneck none     429,362 params
#
# Note the direction of the first one. The encoder's width is per direction
# (`hidden_dim // encoder_directions`), so switching bidirectionality off widens
# each direction from 64 to 128 and leaves the latent vector at 128 either way.
# The unidirectional arm therefore carries 15% MORE parameters than the
# bidirectional one, and the decoder is untouched. That is deliberate: it isolates
# the second reading direction instead of also shrinking the network, so a loss
# here cannot be explained away as reduced capacity. It does mean this arm's
# payload is 1.9676 MB against 1.7176, which has to be said wherever its
# communication figures appear.

[tool.fueba.experiments."encoder-unidirectional"]
efficiency.active_plugins = []
data.is_non_iid = false
model.encoder_bidirectional = false

[tool.fueba.experiments."no-bottleneck"]
efficiency.active_plugins = []
data.is_non_iid = false
model.use_bottleneck = false
