# Delta sparsification with the downlink compressed too. Added 2026-08-12.
#
# The thesis argues delta sparsification is the method to use and weight
# sparsification is the documented negative result, but on total traffic the
# table reads the other way round: 24.2% for delta against 73.9% for
# `top-k-0.1-quant-fp16`. That gap is not a property of the method. Delta already
# uploads less than the weight variant does (123.7 MB against 125.9); it looks
# worse only because nothing compresses the downlink, which is three quarters of
# the traffic. Without this run the thesis reports its own recommendation in an
# incomplete configuration, and a jury reading the total-saving column would be
# right to ask why.
#
# Estimated at roughly 61% total: 123.7 MB up, the ~5955 MB down halved by fp16.
# Delta's measured detection cost is -0.0042 on the test half, inside the noise,
# so the expected result is the best honest trade-off in the table.
#
# Deliberately no quantization on the uplink. The uplink is already 6% of the
# baseline, and adding a second lossy step there would blur what this run is for:
# it asks one question, which is where delta lands once the dominant direction is
# compressed.
[tool.fueba.experiments."delta-0.05-downlink-fp16"]
efficiency.active_plugins = ["delta_sparsification"]
efficiency.sparsification_ratio = 0.05
efficiency.downlink_plugins = ["quantization"]
data.is_non_iid = false

# --- Aggregation rule -------------------------------------------------------
# FedProx against FedAvg. Its penalty targets client drift, which is what long
# local training under a heterogeneous partition causes, so the non-IID pair is
# the one that can show a difference; the IID pair is the control that says
# whether the penalty costs anything when there is no drift to correct.

[tool.fueba.experiments."fedprox-baseline"]
efficiency.active_plugins = []
data.is_non_iid = false
federation.strategy = "fedprox"

